async function send(blob,ext,seconds){
  app.innerHTML=`<div class="eyebrow">${EN?'Almost there':'Почти готово'}</div><div class="card topic"><div class="spin"></div><h2>${EN?'Listening to your Spanish…':'Слушаю твой испанский…'}</h2><p>${EN?'This takes about ten seconds.':'Это займёт секунд десять.'}</p></div>`;
  const body=new FormData();body.set('audio',new File([blob],'speech.'+ext,{type:blob.type}));body.set('question',TOPICS[topic][1]);body.set('seconds',seconds.toFixed(1));body.set('lang',EN?'en':'ru');
  let res,data;try{res=await fetch(API,{method:'POST',body});data=await res.json()}catch(e){goal('speaking_error');problem((EN?'Couldn’t reach the server. Check your internet and try again.':'Не получилось связаться с сервером. Проверь интернет и попробуй ещё раз.'));return}
  if(res.status===429){if(data.scope==='visitor')try{localStorage.setItem('hablar-tries',JSON.stringify({day:today(),n:TRIES_PER_DAY}))}catch(e){}
    problem(data.scope==='visitor'?(EN?'You’ve used your tries for today. Come back tomorrow!':'На сегодня твои попытки закончились. Приходи завтра!'):(EN?'A lot of people used the tool today. Try again tomorrow.':'Сегодня инструментом воспользовалось очень много людей. Попробуй завтра.'),true);return}
  if(!res.ok){goal('speaking_error');problem((EN?'Something went wrong on our side. Try again in a minute.':'Что-то пошло не так на нашей стороне. Попробуй ещё раз через минуту.'));return}
  useTry();if(!data.ok){problem(data.problem);return}
  lead?result(data):gate(data)}
function problem(text,limit){stop();app.innerHTML=`<div class="eyebrow">${EN?'That didn’t work':'Не получилось'}</div><div class="card topic"><h2>${limit?(EN?'No tries left':'Попытки закончились'):(EN?'Shall we try again?':'Попробуем ещё раз?')}</h2><p>${esc(text)}</p>
    <div class="row">${limit?'':`<button class="btn" id="retry">${topic===null?(EN?'Back to the wheel':'К колесу'):(EN?'Back to the topic':'Вернуться к теме')}</button>`}<button class="btn ghost" id="home">К колесу</button></div></div>${limit?ctaCard((EN?'While your tries recharge, shall we talk live?':'Пока попытки отдыхают — поговорим вживую?')):''}`;
  if($('#retry'))$('#retry').onclick=topic===null?home:showTopic;$('#home').onclick=home;bindCta()}
function gate(data){
  app.innerHTML=`<div class="eyebrow">${EN?'Result ready':'Результат готов'}</div><div class="card topic"><h2>${EN?'Your feedback is ready!':'Твой разбор готов!'}</h2><p>${EN?'Leave your name and email to see it. Now and then I’ll send you something useful for your Spanish — no spam.':'Оставь имя и email, чтобы его увидеть. Иногда буду присылать полезное для испанского — без спама.'}</p>
    <form class="gate" id="gate" novalidate><input id="gname" type="text" autocomplete="given-name" maxlength="200" placeholder="${EN?'What’s your name?':'Как тебя зовут?'}" aria-label="${EN?'Name':'Имя'}" required>
      <input id="gmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-label="Email" aria-describedby="gerr" required>
      <p class="err" id="gerr" role="alert" hidden></p><button class="btn" id="gsend">${EN?'Show my feedback':'Показать мой разбор'}</button></form>
    <p class="fine">${EN?'By pressing the button you agree to receive emails from Español con Daniel. You can unsubscribe at any time.':'Нажимая кнопку, ты соглашаешься получать письма от Español con Daniel. Отписаться можно в любой момент.'}</p></div>`;
  $('#gate').onsubmit=e=>{e.preventDefault();const name=$('#gname').value.trim(),email=$('#gmail').value.trim(),err=t=>{$('#gerr').textContent=t;$('#gerr').hidden=false};
    if(!name){err((EN?'Please write your name.':'Напиши, как тебя зовут.'));$('#gname').focus();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err((EN?'Check the address — it looks like there’s a typo.':'Проверь адрес — похоже, в нём ошибка.'));$('#gmail').focus();return}
    $('#gsend').disabled=true;const body=new FormData();for(const [k,v] of Object.entries({...LEAD_FORM.fields,[LEAD_FORM.emailField]:email,[LEAD_FORM.nameField]:name,[LEAD_FORM.levelField]:data.level}))body.set(k,v);
    /* The reply is opaque (no-cors), so don't wait on it for long: the learner gets the result either way. */
    Promise.race([fetch(LEAD_FORM.url+'?isAjax=1',{method:'POST',mode:'no-cors',body}),new Promise(r=>setTimeout(r,4000))]).catch(()=>{}).then(()=>{lead=true;try{localStorage.setItem('palabra-lead','1')}catch(e){}goal('speaking_lead');result(data)})}}
const pace=w=>w<90?(EN?'slow — normal at the start':'медленно — это нормально в начале'):w<140?(EN?'a calm, confident pace':'спокойный, уверенный темп'):(EN?'fluent, almost like a real conversation':'бегло, почти как в живом разговоре');
function ctaCard(title){return `<div class="card cta"><h2>${title||(EN?'Want to speak <em>more freely?</em>':'Хочешь говорить <em>свободнее?</em>')}</h2><p>${EN?'In a free call we’ll go through your speaking live and make a plan: what to learn and in what order.':'На бесплатной встрече разберём твою речь вживую и составим план: что учить и в каком порядке.'}</p>
    <a class="btn" id="cta" href="${BOOKING_URL}" target="_blank" rel="noopener noreferrer">${EN?'Book a free call →':'Записаться на бесплатную встречу →'}</a><p class="fine">${EN?'20 minutes · free · in English if you like':'20 минут · бесплатно · можно по-русски'}</p></div>`}
function bindCta(){const a=$('#cta');if(!a)return;const u=new URL(BOOKING_URL),q=new URLSearchParams(location.search);for(const k of ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'])if(q.has(k))u.searchParams.set(k,q.get(k));a.href=u.href;a.onclick=()=>goal('speaking_cta')}
function result(d){goal('speaking_result');const li=LEVELS.indexOf(d.level),fillers=Object.entries(d.fillers||{}),fn=fillers.reduce((a,[,n])=>a+n,0),p=last[topic],left=triesLeft();last[topic]={level:d.level,wpm:d.wpm};
  app.innerHTML=`<div class="eyebrow">${EN?'Your feedback · ':'Твой разбор · '}${esc(TOPICS[topic][0])}</div>
    <div class="card" style="margin-top:14px"><div class="level"><strong>${d.level}</strong><div style="flex:1"><small>${EN?'Approximate speaking level':'Примерный разговорный уровень'}</small><div class="track">${LEVELS.map((l,i)=>`<i class="${i<li?'on':i===li?'now':''}">${l}</i>`).join('')}</div></div></div>
      <p style="margin-top:12px">${esc(d.level_reason)}</p>
      ${p?`<p class="prev">${EN?`Last try on this topic: ${p.level}, ${p.wpm} words a minute. Now: ${d.level}, ${d.wpm}.`:`Прошлая попытка на эту тему: ${p.level}, ${p.wpm} слов в минуту. Сейчас: ${d.level}, ${d.wpm}.`}</p>`:''}
      <div class="stats"><div><b>${d.wpm}</b><span>${EN?`words a minute — ${pace(d.wpm)}`:`слов в минуту — ${pace(d.wpm)}`}</span></div><div><b>${fn}</b><span>${fn?(EN?'filler words: ':'слов-паразитов: ')+fillers.map(([f,n])=>esc(f)+(n>1?' ×'+n:'')).join(', '):(EN?'filler words — clean speech':'слов-паразитов — чистая речь')}</span></div></div>
      <div class="block"><h3>${EN?'What’s already working':'Что уже получается'}</h3><ul>${d.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
      ${d.corrections.length?`<div class="block"><h3>${EN?'What to fix':'Что поправить'}</h3>${d.corrections.map(c=>`<div class="fix"><s lang="es">${esc(c.said)}</s> → <b lang="es">${esc(c.better)}</b><span>${esc(c.why)}</span></div>`).join('')}</div>`:''}
      <div class="block"><h3>${EN?'How a native speaker would say it':'Как это сказал бы носитель'}</h3><p class="es" lang="es">${esc(d.improved)}</p></div>
      <div class="block"><h3>${EN?'What to practise':'Что тренировать'}</h3><p>${esc(d.tip)}</p></div>
      <details><summary>${EN?'What I heard':'Что я услышал'}</summary><p lang="es" style="margin-top:6px">${esc(d.transcript)}</p></details>
      <p class="fine">${EN?'This is an estimate from one minute of speech, not your full Spanish level.':'Это оценка по одной минуте речи, а не полный уровень испанского.'}</p></div>
    ${ctaCard()}
    <div class="row two">${left>0?(EN?'<button class="btn ghost" id="same">Same topic again</button>':'<button class="btn ghost" id="same">Ещё раз на эту тему</button>'):(EN?'<a class="btn ghost" href="/placement-game/">Vocabulary game</a>':'<a class="btn ghost" href="/placement-game/">Игра: словарный запас</a>')}<button class="btn ghost" id="other">${EN?'Another topic':'Другая тема'}</button></div>
    <p class="fine">${triesNote()}</p>`;
  if($('#same'))$('#same').onclick=showTopic;$('#other').onclick=home;bindCta();window.scrollTo(0,0)}
home();
if(EN){document.title='Speak — check your spoken Spanish | Español con Daniel';document.querySelector('meta[name="description"]').content='Spin the wheel, get a topic and answer out loud in Spanish for a minute. An approximate speaking level, your pace and your mistakes explained — free.';
  document.querySelectorAll('[data-en]').forEach(e=>{e.textContent=e.dataset.en})}
document.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{if((b.dataset.setlang==='en')===EN)return;try{localStorage.setItem('lang',b.dataset.setlang)}catch(e){}location.reload()});
</script>
</body></html>
